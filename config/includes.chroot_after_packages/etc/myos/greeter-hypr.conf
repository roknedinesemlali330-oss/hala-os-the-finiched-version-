# Minimal Hyprland used only to show the login screen
monitor = , preferred, auto, 1

exec-once = sh -c 'qs -p /etc/myos/greeter || touch /tmp/myos-greeter-failed; hyprctl dispatch exit'

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
